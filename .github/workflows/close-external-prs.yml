name: Close external pull requests

# External pull requests aren't accepted (see CONTRIBUTING.md): close them
# with a pointer to forking under the license.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != github.repository_owner
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Thank you for your interest in Mango!\n\nThis repository doesn't accept external pull requests, so this one has been closed automatically. You're welcome to fork it for noncommercial use under the **PolyForm Noncommercial License 1.0.0**, and to report bugs in **Issues**.",
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: "closed",
            });
